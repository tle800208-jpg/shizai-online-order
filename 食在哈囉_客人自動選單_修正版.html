html<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食在哈囉｜客人自動選單</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
header{background:#fff;padding:18px 14px 10px;position:sticky;top:0;z-index:10;box-shadow:0 1px 8px #0002}
h1{margin:0;font-size:23px}.sub{margin-top:5px;color:#777;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;border-radius:999px;padding:10px 13px;background:#eee;font-size:14px}.tab.active{background:#222;color:#fff}
main{padding:14px 14px 105px}.section-title{font-size:19px;font-weight:800;margin:4px 0 12px}
.grid{display:grid;gap:10px}.card{background:#fff;border-radius:16px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 5px #0001}
.code{font-size:12px;color:#888;font-weight:700}.name{font-size:16px;font-weight:650;margin-top:3px}.price{font-size:14px;font-weight:800;margin-top:4px}
.qty{display:flex;align-items:center;gap:7px;flex-shrink:0}.qty button{width:38px;height:38px;border:0;border-radius:50%;background:#eee;font-size:22px}.n{min-width:22px;text-align:center;font-weight:800}
.panel{background:#fff;border-radius:17px;padding:16px;margin-top:14px}.panel h2{font-size:19px;margin:0 0 12px}
.cartline{padding:7px 0;border-bottom:1px solid #eee;font-size:15px}.cartline:last-child{border-bottom:0}
.total{text-align:right;font-size:21px;font-weight:900;margin-top:12px}
label{display:block;font-weight:700;margin-top:10px}input,textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}
.primary,.copy{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;margin-top:12px}.primary{background:#222;color:#fff}.copy{background:#eee}
#result{white-space:pre-wrap;background:#f5f5f5;border-radius:11px;padding:12px;margin-top:12px;font-size:14px;line-height:1.6}
.hidden{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:9px 14px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0002;z-index:20;display:flex;gap:9px}
.cartbtn{flex:1;background:#222;color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:800}.clearbtn{background:#eee;border:0;border-radius:12px;padding:12px}
.notice{background:#fff7df;border-radius:12px;padding:10px 12px;font-size:13px;color:#6b5a2a;margin-bottom:12px}
</style>
</head>
<body>
<header>
<h1>🍜 食在哈囉｜線上點餐</h1>
<div class="sub">點選餐點與數量，完成後產生訂單</div>
<div class="tabs" id="tabs"></div>
</header>

<main>
<div class="notice">請先選擇上方分類，再按餐點右側的「＋」增加數量。</div>
<div class="section-title" id="title"></div>
<div id="menu" class="grid"></div>

<section class="panel">
<h2>🧾 訂單確認</h2>
<div id="cartList">尚未選擇餐點</div>
<div class="total" id="total">合計：0 元</div>
</section>

<section class="panel">
<h2>👤 取餐資料</h2>
<label>姓名<input id="customer" placeholder="請輸入姓名"></label>
<label>電話<input id="phone" type="tel" placeholder="請輸入電話"></label>
<label>取餐日期<input id="date" type="date"></label>
<label>取餐時間<input id="time" type="time"></label>
<label>備註<textarea id="note" rows="3" placeholder="例如：不要蔥、少辣"></textarea></label>
<button class="primary" onclick="makeOrder()">✅ 產生訂單</button>
<div id="result" class="hidden"></div>
<button id="copy" class="copy hidden" onclick="copyOrder()">📋 複製訂單，貼回 LINE</button>
</section>
</main>

<div class="bottom">
<button class="cartbtn" onclick="document.querySelector('.panel').scrollIntoView({behavior:'smooth'})">🛒 查看訂單　<span id="count">0</span> 件</button>
<button class="clearbtn" onclick="clearCart()">清除</button>
</div>

<script>
const items=[{"id": "A1", "name": "滿漢大餐 蔥燒牛肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A2", "name": "滿漢大餐 豬肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A3", "name": "一度讚 豬肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A4", "name": "一度讚 牛肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A5", "name": "拉麵道 豚骨", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "A6", "name": "味味A 排骨G麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "A7", "name": "維力 炸醬麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "A8", "name": "維力 炒泡麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "B1", "name": "辛拉麵", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "B2", "name": "韓式部隊鍋", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "B3", "name": "不倒翁 海鮮烏龍麵", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "B4", "name": "三養食品 黑火雞麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "C1", "name": "台式經典", "price": 160, "cat": "🍳 套餐"}, {"id": "C2", "name": "台式加蛋套餐", "price": 180, "cat": "🍳 套餐"}, {"id": "C3", "name": "韓式經典", "price": 160, "cat": "🍳 套餐"}, {"id": "C4", "name": "韓式加蛋套餐", "price": 180, "cat": "🍳 套餐"}, {"id": "D1", "name": "雞蛋", "price": 15, "cat": "🥚 加料"}, {"id": "D2", "name": "青菜", "price": 35, "cat": "🥚 加料"}, {"id": "D3", "name": "火鍋料", "price": 35, "cat": "🥚 加料"}, {"id": "D4", "name": "牛肉片", "price": 40, "cat": "🥚 加料"}, {"id": "D5", "name": "豬肉片", "price": 30, "cat": "🥚 加料"}, {"id": "D6", "name": "蝦子", "price": 50, "cat": "🥚 加料"}, {"id": "D7", "name": "魷魚", "price": 50, "cat": "🥚 加料"}, {"id": "D8", "name": "蛤蜊", "price": 50, "cat": "🥚 加料"}, {"id": "D9", "name": "起司片", "price": 20, "cat": "🥚 加料"}, {"id": "D10", "name": "玉米粒", "price": 15, "cat": "🥚 加料"}, {"id": "E1", "name": "古早味紅茶 700CC", "price": 30, "cat": "🥤 飲料"}, {"id": "F1", "name": "奶油蒜蝦", "price": 350, "cat": "🦐 熱炒"}, {"id": "F2", "name": "塔香炒蝦", "price": 350, "cat": "🦐 熱炒"}, {"id": "F3", "name": "水煮蝦", "price": 350, "cat": "🦐 熱炒"}, {"id": "F4", "name": "塔香蛤蜊", "price": 280, "cat": "🦐 熱炒"}, {"id": "F5", "name": "爆炒黃豆芽", "price": 120, "cat": "🦐 熱炒"}, {"id": "F6", "name": "五花肉炒豆干", "price": 220, "cat": "🦐 熱炒"}, {"id": "F7", "name": "空心菜炒牛肉", "price": 250, "cat": "🦐 熱炒"}, {"id": "G1", "name": "原味 四吋", "price": 180, "cat": "🍰 巴斯克蛋糕"}, {"id": "G2", "name": "原味 六吋", "price": 290, "cat": "🍰 巴斯克蛋糕"}, {"id": "G3", "name": "可可 四吋", "price": 180, "cat": "🍰 巴斯克蛋糕"}, {"id": "G4", "name": "可可 六吋", "price": 290, "cat": "🍰 巴斯克蛋糕"}, {"id": "G5", "name": "抹茶 四吋", "price": 180, "cat": "🍰 巴斯克蛋糕"}, {"id": "G6", "name": "抹茶 六吋", "price": 290, "cat": "🍰 巴斯克蛋糕"}];
const cats=[...new Set(items.map(x=>x.cat))];
let active=cats[0],cart={},orderText="";
const tabs=document.getElementById("tabs"),menu=document.getElementById("menu");

cats.forEach(c=>{
 const b=document.createElement("button");
 b.className="tab"; b.textContent=c;
 b.onclick=()=>{active=c;render()};
 tabs.appendChild(b);
});

function render(){
 document.getElementById("title").textContent=active;
 menu.innerHTML="";
 items.filter(x=>x.cat===active).forEach(x=>{
   const q=cart[x.id]||0;
   const d=document.createElement("div"); d.className="card";
   d.innerHTML=`<div><div class="code">${x.id}</div><div class="name">${x.name}</div><div class="price">${x.price} 元</div></div>
   <div class="qty"><button aria-label="減少" onclick="change('${x.id}',-1)">−</button><div class="n">${q}</div><button aria-label="增加" onclick="change('${x.id}',1)">＋</button></div>`;
   menu.appendChild(d);
 });
 [...tabs.children].forEach((b,i)=>b.classList.toggle("active",cats[i]===active));
 renderCart();
}

function change(id,n){
 cart[id]=Math.max(0,(cart[id]||0)+n);
 if(!cart[id]) delete cart[id];
 render();
}

function renderCart(){
 const arr=items.filter(x=>cart[x.id]);
 document.getElementById("cartList").innerHTML=arr.length
 ? arr.map(x=>`<div class="cartline">${x.id}｜${x.name} × ${cart[x.id]}　小計 ${x.price*cart[x.id]} 元</div>`).join("")
 : "尚未選擇餐點";
 const total=arr.reduce((s,x)=>s+x.price*cart[x.id],0);
 document.getElementById("total").textContent=`合計：${total} 元`;
 document.getElementById("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}

function makeOrder(){
 const arr=items.filter(x=>cart[x.id]);
 if(!arr.length){alert("請先選擇餐點");return}
 const name=document.getElementById("customer").value.trim();
 if(!name){alert("請填寫姓名");return}
 const total=arr.reduce((s,x)=>s+x.price*cart[x.id],0);
 orderText=`【食在哈囉｜新訂單】
姓名：${name}
電話：${document.getElementById("phone").value.trim()}
取餐日期：${document.getElementById("date").value}
取餐時間：${document.getElementById("time").value}

${arr.map(x=>`${x.id}｜${x.name} × ${cart[x.id]}｜${x.price*cart[x.id]} 元`).join("\n")}

合計：${total} 元
付款方式：現金
取餐方式：外帶
備註：${document.getElementById("note").value.trim()}`;
 document.getElementById("result").textContent=orderText;
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("copy").classList.remove("hidden");
}

async function copyOrder(){
 try{await navigator.clipboard.writeText(orderText);alert("訂單已複製，可以貼到 LINE。")}
 catch(e){alert("請長按訂單文字後選擇「拷貝」。")}
}
function clearCart(){cart={};document.getElementById("result").classList.add("hidden");document.getElementById("copy").classList.add("hidden");render()}
document.getElementById("date").value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
